  <header id="titlebar">

      <span>NOVA</span><small>Music</small>
    </div>
    <label class="tsearch"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search songs, artists, albums, folders" autocomplete="off" aria-label="Search"><kbd>Ctrl F</kbd></label>

  </header>

      <button class="nav" data-nav="folders"><svg class="ic"><use href="#i-folder"/></svg><span>Folders</span></button>

      <button class="nav" data-nav="favorites"><svg class="ic"><use href="#i-heart"/></svg><span>Favorites</span></button>

        <button class="addf" data-act="add-folder"><svg class="ic"><use href="#i-addfolder"/></svg><span>Add folder</span></button>
        <p id="libstat"></p>
      </div>
    </nav>

    <div id="mainwrap">
      <main id="main" tabindex="-1"></main>
      <div id="mini" class="glass" role="region" aria-label="Now playing">
        <div class="mi" data-act="np-open" role="button" tabindex="0" aria-label="Open full player">
          <img class="cov" id="m-art" alt="">
          <div class="tt"><b id="m-title"></b><span id="m-artist"></span></div>
        </div>
        <div class="mc">
          <div class="tp">
            <button class="ib" data-act="shuffle" id="m-shuf" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
            <button class="ib" data-act="prev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
            <button class="pbtn" data-act="toggle" aria-label="Play or pause"><svg class="ic i-play"><use href="#i-play"/></svg><svg class="ic i-pause"><use href="#i-pause"/></svg></button>
            <button class="ib" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
            <button class="ib sk" data-act="repeat" id="m-rep" aria-label="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
          </div>
          <div class="prog"><time id="m-pos">0:00</time><div class="sl" data-slider="seek" data-min="0" data-max="1" data-step="0.001" role="slider" tabindex="0" aria-label="Seek"><div class="tr"></div><div class="fl"></div><div class="th"></div></div><time id="m-dur">0:00</time></div>
        </div>
        <div class="mr">
          <button class="ib fav" data-act="fav-cur" id="m-fav" aria-label="Favorite"><svg class="ic"><use href="#i-heart"/></svg></button>
          <button class="ib vbtn" data-act="mute" id="m-mute" aria-label="Mute"><svg class="ic"><use href="#i-volume"/></svg></button>
          <div class="sl vol" data-slider="vol" data-min="0" data-max="1" data-step="0.01" role="slider" tabindex="0" aria-label="Volume"><div class="tr"></div><div class="fl"></div><div class="th"></div></div>
          <button class="ib" data-act="more-cur" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
          <button class="ib" data-act="np-open" aria-label="Expand"><svg class="ic" style="transform:rotate(180deg)"><use href="#i-down"/></svg></button>
        </div>
      </div>
    </div>

    <section id="np" aria-label="Full player">
      <canvas id="spec"></canvas>
      <div class="top">
        <button class="ib" data-act="np-close" aria-label="Close player"><svg class="ic"><use href="#i-down"/></svg></button>
        <div class="from" id="np-from"></div>
        <button class="ib" data-act="more-cur" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
      </div>
      <div class="stage">
        <canvas id="ring"></canvas>
        <img class="np-art float" id="np-art" alt="">
      </div>
      <div class="np-side glass">
        <h1 id="np-title"></h1>
        <div class="by" id="np-artist"></div>
        <div class="meta" id="np-meta"></div>
        <div class="prog"><time id="n-pos">0:00</time><div class="sl big" data-slider="seek" data-min="0" data-max="1" data-step="0.001" role="slider" tabindex="0" aria-label="Seek"><div class="tr"></div><div class="fl"></div><div class="th"></div></div><time id="n-dur">0:00</time></div>
        <div class="tp">
          <button class="ib" data-act="shuffle" id="n-shuf" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
          <button class="ib" data-act="prev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button class="pbtn lg" data-act="toggle" aria-label="Play or pause"><svg class="ic i-play"><use href="#i-play"/></svg><svg class="ic i-pause"><use href="#i-pause"/></svg></button>
          <button class="ib" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
          <button class="ib" data-act="repeat" id="n-rep" aria-label="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="upn"><h3>Up next<span id="np-qc"></span></h3><div class="ql" id="np-q"></div></div>
      </div>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
