name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies & Capacitor CLI
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android
        mkdir -p app/fonts
        mkdir -p scripts
        if [ -f build-renderer.js ]; then cp build-renderer.js scripts/; fi

    - name: Build web assets
      run: |
        mkdir -p app/fonts
        node scripts/build-renderer.js || node build-renderer.js || true

    - name: Sync Capacitor Android
      run: |
        npx @capacitor/cli init NovaMusic com.novamusic.app --web-dir app
        npx @capacitor/cli add android || true
        npx @capacitor/cli sync android

    - name: Make Gradlew Executable
      run: chmod +x android/gradlew

    - name: Build APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
